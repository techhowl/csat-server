# Development stack. Start with `make dev`, stop with `make down`.
# All three Node services share one dev image and the same bind-mounted source;
# only the start command differs.
#
# Config and secrets come from the repo-root .env (cp .env.example .env and
# fill it in). Compose injects it into every service via env_file.

services:
  # Local MongoDB. Services reach it at mongodb://mongo:27017; the host (npm run
  # dev:*, Compass, mongosh) at mongodb://localhost:27017. Data persists in the
  # mongo-data volume (make down-v drops it).
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - csat

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev:api
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - csat

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev:worker
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - csat

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev:scheduler
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - csat

volumes:
  mongo-data:

networks:
  csat:
    driver: bridge
